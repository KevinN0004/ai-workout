name: Plan evals

# Generates plans for the ten profiles in scripts/evals/profiles.mjs, three
# times each, scores them, and fails when they break structure or score worse
# than the committed reference (docs/specs/2026-11-03-plan-quality-evals-design.md).
# Manual only: every run makes about 30 live Gemini calls.
#
# Requires the repository secret GEMINI_EVAL_API_KEY: a Gemini key from a Google
# project of its own, so a run never spends production's quota. The scores file
# is uploaded whether the run passed or not; committing one into
# scripts/evals/results/ is how a run becomes the reference.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model to evaluate (blank: the production default)"
        required: false
        default: ""

concurrency:
  group: plan-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evals:
    name: Generate and score plans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      # The input reaches the script through the environment, never the
      # command line, so no value of it is run as shell. The report goes to the
      # job summary; progress goes to the log.
      - name: Generate and score
        env:
          GEMINI_EVAL_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
        run: node scripts/evals/run.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scores
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-eval-scores
          path: scripts/evals/out/
          if-no-files-found: ignore
