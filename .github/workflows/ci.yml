name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Supersede in-flight runs on the same ref rather than paying for both, except on
# main -- an intermediate commit there should keep its own CI signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Imports only node builtins, so it runs before the install: a stale review
      # date fails in about a second rather than sixty.
      - name: Audit Allowlist Expiry
        run: node scripts/check-audit-allowlist.mjs

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Script Tests
        run: npm run test:scripts

      - name: Dependency Audit
        run: npx --yes audit-ci@7.1.0 --config .audit-ci.json

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_workout_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Needs no database, so it runs first: a migration problem cannot mask an
      # unrelated client failure.
      - name: Client Tests
        run: npm -w client run test

      - name: Generate Prisma Client
        run: npm -w server run prisma:generate

      - name: Apply Postgres Migrations
        run: npm -w server run migrate:postgres

      - name: Server Tests
        run: npm -w server run test

  build:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Client Build
        run: npm -w client run build
