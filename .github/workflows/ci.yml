name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Supersede in-flight runs on the same ref rather than paying for both, except on
# main -- an intermediate commit there should keep its own CI signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Imports only node builtins, so it runs before the install: a stale review
      # date fails in about a second rather than sixty.
      - name: Audit Allowlist Expiry
        run: node scripts/check-audit-allowlist.mjs

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # knip.json declares the hook scripts in scripts/ as entry points. Nothing
      # else can see that they are live -- they are invoked from
      # .claude/settings.json -- so without this gate the config can rot
      # unnoticed, and knip then reports the whole hook wiring as unused.
      - name: Knip
        run: npm run knip

      - name: Script Tests
        run: npm run test:scripts

      - name: Dependency Audit
        run: npx --yes audit-ci@7.1.0 --config security/audit-ci.json

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_workout_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Needs no database, so it runs first: a migration problem cannot mask an
      # unrelated client failure.
      - name: Client Tests + Coverage
        run: npm -w client run test:coverage

      - name: Generate Prisma Client
        run: npm -w server run prisma:generate

      - name: Apply Postgres Migrations
        run: npm -w server run migrate:postgres

      - name: Server Tests + Coverage
        run: npm -w server run test:coverage

  build:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Client Build
        run: npm -w client run build

  # Builds AND runs the deployable. Building alone would catch a bad COPY or a
  # failing npm ci, but not the failures that only appear at runtime: the image
  # runs as the non-root `node` user, so a path it cannot read fails when the
  # process starts rather than when the layer is built.
  #
  # This also rehearses the release order the deploy workflow depends on --
  # migrate, then start -- against a real database. 002_password_changed_at.sql
  # adds a column userReadRepository selects on every user read, so starting
  # the image against an unmigrated database fails every authenticated request.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_workout_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build Image
        run: docker build -t ai-workout:ci .

      # From the runner, not the image: the release sequence runs migrations as
      # a separate step precisely so the image never has to.
      - name: Install Dependencies
        run: npm ci

      - name: Apply Postgres Migrations
        run: npm -w server run migrate:postgres

      # --network host so the container reaches the postgres service on
      # localhost:5432. Inside a bridged container, localhost is the container.
      - name: Run Image
        run: |
          docker run -d --name ai-workout-ci --network host \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e CLIENT_ORIGIN=http://localhost:5000 \
            -e LOG_LEVEL=warn \
            ai-workout:ci

      - name: Wait For Health
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 5 http://localhost:5000/api/health > /dev/null; then
              echo "healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "never became healthy"
          exit 1

      # The reason this job exists rather than a plain `docker build`. The
      # image is only a valid deployable if it serves the client from its own
      # origin -- a bundle on another host cannot reach this API at all, since
      # every client call is a relative path and both cookies are SameSite=Lax.
      - name: Smoke The Deployable
        run: |
          set -e
          echo "--- client shell at / ---"
          curl --silent --fail http://localhost:5000/ | grep -q 'id="root"'

          echo "--- a client route falls back to the shell ---"
          curl --silent --fail http://localhost:5000/dashboard/settings | grep -q 'id="root"'

          echo "--- the API answers JSON, not the shell ---"
          curl --silent --fail http://localhost:5000/api/health | grep -q '"status":"ok"'

          echo "--- an unknown /api path 404s instead of returning the shell ---"
          code=$(curl --silent --output /tmp/api404 --write-out '%{http_code}' http://localhost:5000/api/nope)
          test "$code" = "404"
          ! grep -q 'id="root"' /tmp/api404

          echo "--- readiness reports postgres connected ---"
          curl --silent http://localhost:5000/api/ready | grep -q '"postgres":{"configured":true,"connected":true'

      - name: Container Logs
        if: ${{ !cancelled() }}
        run: docker logs ai-workout-ci || true

  # The only job that runs the client and server together. Everything else tests
  # one side of the wire, so a defect in the wiring between them -- a cookie
  # flag, a missing CSRF header, a proxy path -- passes every other job here.
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_workout_test
      # Only DATABASE_URL is actually required by the env preflight. GEMINI_API_KEY
      # is deliberately absent: plan generation is out of scope for the smoke
      # suite because it needs a live Gemini key.
      CLIENT_ORIGIN: http://localhost:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Chromium only, matching playwright.config.js. --with-deps pulls the
      # system libraries the headless browser needs on a bare runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npm -w server run prisma:generate

      - name: Apply Postgres Migrations
        run: npm -w server run migrate:postgres

      # The suite runs against the built bundle via `vite preview`, so the build
      # has to happen before playwright starts its web servers.
      - name: Client Build
        run: npm -w client run build

      - name: E2E
        run: npm run test:e2e

      # Uploads on every non-cancelled run, not only on failure. `retries: 1`
      # and `trace: "on-first-retry"` mean a test that fails once and passes on
      # retry produces a trace -- and the job then succeeds, so `if: failure()`
      # threw away the traces from exactly the runs worth investigating. It also
      # keeps this step from being first exercised the moment e2e breaks.
      # Measured: a green run writes a single 520 KB index.html; a run carrying a
      # trace writes 1.9 MB, because the report bundles the trace viewer so it
      # opens offline. Both compress well and expire in a week.
      #
      # `if-no-files-found: error` is what makes it a gate rather than a step
      # that merely runs: the default is `warn`, which lets a missing report read
      # as a pass. The HTML reporter is active whenever CI is set, so the file is
      # always produced.
      #
      # The name carries the run attempt because artifacts are scoped to the
      # workflow run and v7 fails on a name collision. Suffixing rather than
      # setting `overwrite: true` is deliberate: the re-run you start to find out
      # whether a failure was flaky would otherwise overwrite the failing report
      # with a passing one, destroying the comparison worth having.
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
