name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Client Tests
        run: npm -w client run test

      - name: Server Tests
        run: npm -w server run test

      - name: Client Build
        run: npm -w client run build

      - name: Dashboard Migration Dry Run (Optional)
        if: ${{ secrets.CI_MONGODB_URI != '' }}
        env:
          MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
        run: npm -w server run migrate:dashboard-activities -- --dry-run --skip-cleanup

