name: Deploy

# Migrations run here, before the deploy is triggered, and that ordering is the
# whole reason this workflow exists rather than letting Render deploy on push.
#
# 002_password_changed_at.sql adds a column userReadRepository selects on every
# user read. A server started against an unmigrated database therefore fails
# every authenticated request, not just the new routes. render.yaml sets
# autoDeployTrigger: off so nothing can start before this has run.
#
# Requires three repository secrets:
#   PRODUCTION_DATABASE_URL  Neon pooled connection string, with ?sslmode=verify-full
#                            (docs/deploy-runbook.md, Step 1 says why not `require`)
#   RENDER_DEPLOY_HOOK_URL   Render dashboard -> the service -> Settings -> Deploy Hook
#   RENDER_SERVICE_URL       e.g. https://ai-workout.onrender.com, for the smoke check
#
# Automatic deploys after CI on main also need the repository variable
# AUTO_DEPLOY set to "true" (Settings -> Secrets and variables -> Actions ->
# Variables). Until it is set, those runs are skipped rather than failed, so a
# repository with no deployment configured does not go red on every merge. A
# manual "Run workflow" is never gated: that is how the first deploy is done,
# and with the secrets missing it should fail loudly.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate, then deploy
    runs-on: ubuntu-latest
    # Never deploy a red build. workflow_run fires whatever the outcome, so the
    # conclusion has to be checked explicitly -- it is not implied by the
    # trigger. A manual dispatch has no upstream run and is allowed through,
    # and AUTO_DEPLOY does not gate it: switching automatic deploys on is a
    # separate, later decision (see the header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Applies every unapplied .sql in server/db/postgres in filename order and
      # records each in schema_migrations, so re-running is a no-op. Failing
      # here stops the deploy, which is the point: the old code tolerates the
      # new column, so migrate-then-deploy is safe in this direction, but
      # deploy-then-migrate is not.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run migrate:postgres -w server

      # Render keeps the previous instance serving until the new one passes its
      # health check, so a bare "ready" straight after the hook comes from the
      # OLD code -- on the #160 deploy it answered 3 s after the hook, 907 s old.
      # Record the serving instance's uptime here, as close to the hook as
      # possible; the wait below only accepts an instance younger than it.
      # The logic lives in scripts/manual-deploy.mjs, tested, and is shared with
      # the manual deploy, so the two cannot disagree about what "live" means.
      - name: Record the instance serving now
        id: baseline
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "baseline=null" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { readBaseline } from "./scripts/manual-deploy.mjs";
            const baseline = await readBaseline(process.env.SERVICE_URL.replace(/\/+$/, ""));
            console.log(baseline ? `Serving now: uptime ${baseline.uptimeSec}s.` : "Nothing answering; the first ready response will count.");
            appendFileSync(process.env.GITHUB_OUTPUT, `baseline=${JSON.stringify(baseline)}\n`);
          '

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set."
            exit 1
          fi
          # Fail the step on a non-2xx rather than reporting a deploy that was
          # never accepted.
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Deploy triggered."

      # Render builds and health-checks asynchronously, so the hook returning
      # 200 means "accepted", not "live". This waits for the NEW instance --
      # younger than the one recorded above -- to report ready. Polls every
      # 15 s for ~15 minutes: a free instance cold-starts in 30-60 s, and a
      # Docker build takes longer still.
      - name: Wait for the new instance to report ready
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL is not set; skipping the smoke check."
            exit 0
          fi
          node --input-type=module -e '
            import { waitForNewInstance } from "./scripts/manual-deploy.mjs";
            const result = await waitForNewInstance({
              serviceUrl: process.env.SERVICE_URL.replace(/\/+$/, ""),
              baseline: JSON.parse(process.env.BASELINE || "null")
            });
            if (result.ok) {
              console.log(`Live: the new instance reported ready (attempt ${result.attempt}).`);
              process.exit(0);
            }
            console.log("The new instance did not report ready within ~15 minutes.");
            console.log("If the attempts said the old instance is still serving, the new build");
            console.log("never passed the health check on Render -- read the logs of that deploy there.");
            console.log("If /api/ready reports not_ready with postgres healthy, check REDIS_URL:");
            console.log("a configured-but-unreachable Redis falls back to in-memory sessions");
            console.log("and this endpoint stays not_ready by design.");
            process.exit(1);
          '
