# Development dependencies only. The app itself is deliberately NOT
# containerised -- Vite and `node --watch` keep running natively so hot reload
# and the Windows workflow are preserved.
#
# Postgres publishes on 55432 to match server/scripts/start-local-postgres.ps1.
# The two are alternatives, not complements: same port, so they collide.
#
# Both published ports are bound to 127.0.0.1 on purpose, and the loopback
# prefix is load-bearing rather than cosmetic. Docker's default is 0.0.0.0,
# and the local-Postgres helper binds 127.0.0.1 -- on Windows those two do
# NOT collide, so `docker compose up -d` would succeed while every localhost
# connection kept reaching the native instance. Compose looked healthy, the
# migration reported "skipped", and the container sat at zero tables with no
# error anywhere. Binding loopback here is what makes the collision real, and
# therefore what makes the sentence above true. It also stops publishing a
# development database on every interface.
services:
  postgres:
    # 18 to match production (Neon), CI, and the native helper, which prefers
    # the newest install it finds.
    image: postgres:18
    container_name: ai-workout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_workout_dev}
      POSTGRES_DB: ai_workout
    ports:
      - "127.0.0.1:55432:5432"
    # The 18 image keeps its data under /var/lib/postgresql/18/docker and
    # expects the volume one level up; mounted at the old .../data path, the
    # data would land in an anonymous volume and vanish with the container.
    # A new volume name, too: the old postgres-data holds 16-format files the
    # 18 server cannot open, and it is left untouched rather than reused.
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workout"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ai-workout-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres18-data:
