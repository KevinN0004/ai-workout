# Render blueprint for the free stack: this service on Render, Postgres on
# Neon, Redis on Upstash. See the Deployment section of README.md for why the
# database and cache come from elsewhere -- Render's own free Postgres expires
# after 30 days and its free Key Value loses data on restart, which would sign
# every user out, since Redis is what holds sessions here.
#
# One service, not two. The client bundle is served by this process from its
# own origin; a separately-hosted bundle cannot reach the API at all. See
# server/src/staticClient.js.

services:
  - name: ai-workout
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /api/ready, not /api/health. The liveness endpoint answers 200 without
    # touching anything, so it cannot tell whether Postgres is connected.
    #
    # This is safe to gate deploys on, which is worth stating because it is
    # not obviously true: index.js awaits connectPostgres, connectPrisma and
    # initSessionStore BEFORE app.listen, so the process accepts no connection
    # until its dependencies have settled. By the time Render can reach this
    # path it reports the truth rather than a race.
    #
    # Consequence worth knowing: if Redis is configured but unreachable, the
    # app falls back to in-memory sessions and this path reports not_ready
    # permanently, so the deploy fails health checks even though the process is
    # up. That is the intended signal -- in-memory sessions on a tier that
    # spins down every 15 minutes means users are signed out constantly. If a
    # deploy fails here, check REDIS_URL first.
    healthCheckPath: /api/ready

    # Off, deliberately. Migrations must land before the new code starts:
    # 002_password_changed_at.sql adds a column userReadRepository selects on
    # every user read, so a server started against an unmigrated database
    # fails every authenticated request, not just the new routes. Deploys are
    # triggered by .github/workflows/deploy.yml AFTER it has migrated.
    autoDeployTrigger: "off"

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is injected by Render and read by index.js; do not set it here.

      # Neon. Include ?sslmode=verify-full -- the Prisma adapter takes no
      # separate ssl option, so TLS has to ride the URL. verify-full rather
      # than the require Neon suggests: pg resolves them identically today, but
      # warns that its next major weakens require to skip certificate
      # verification. Use Neon's POOLED connection string: this process holds a
      # pool of its own.
      - key: DATABASE_URL
        sync: false

      # Required when NODE_ENV=production, and the preflight refuses to start
      # without it. Same-origin serving means CORS is barely exercised, but the
      # check is unconditional. Set it to this service's own URL, e.g.
      # https://ai-workout.onrender.com
      - key: CLIENT_ORIGIN
        sync: false

      # Upstash. Use the rediss:// URL so the connection is TLS.
      #
      # Not optional in practice on this plan. Free instances spin down after
      # 15 minutes idle, and every in-memory fallback is lost on each spin-down.
      # Without Redis that means visitors are signed out several times a day,
      # rate limit counters reset (including the anonymous generate quota that
      # guards the Gemini key), and the external cache loses its stale window --
      # the six-hour buffer that serves old data when an upstream is down.
      - key: REDIS_URL
        sync: false

      # Plan generation returns an error without it; everything else works.
      - key: GEMINI_API_KEY
        sync: false

      # Without this a production 500 exists only in Render's log viewer, which
      # on the free tier is thin and ephemeral. The error tracking is already
      # built and tested; this is the only thing it was missing.
      - key: SENTRY_DSN
        sync: false

      # The browser's DSN, from a React project. Used twice: the Docker build
      # bakes it into the bundle, and the server adds its ingest host to the
      # CSP's connect-src at runtime -- one value, so the two cannot drift.
      # Unset, the client reports nothing.
      - key: VITE_SENTRY_DSN
        sync: false

      # Required, not optional: externalDataService throws "OpenAQ API key is
      # not configured" without it. The route treats that like an upstream
      # outage and answers 200 with `fallback: true` and no readings, so the
      # dashboard shows air quality as unavailable rather than breaking -- a
      # permanently dead air-quality panel rather than an outage. The browser
      # sees no error status; the server log is where it shows, as
      # `external_api_retry` warnings naming the missing key.
      - key: OPENAQ_API_KEY
        sync: false

      # Guards /api/metrics, which otherwise reports authFailures and per-route
      # latency to anyone. Generate any long random string. Leaving it unset in
      # production closes the endpoint rather than publishing it, so this is a
      # choice between "closed" and "readable by you".
      - key: METRICS_TOKEN
        sync: false

      # POSTGRES_STARTUP_REQUIRED defaults to true when NODE_ENV=production,
      # which is what we want: a server that cannot reach its database should
      # fail loudly at boot rather than serve 500s.
